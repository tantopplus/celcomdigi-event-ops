<style>
:root{
  --navy:#0b1f66; --navy-2:#13308f; --blue:#1689e0; --blue-d:#0b6fc2; --blue-soft:#e8f3fd;
  --yellow:#ffd400; --yellow-soft:#fff8d6;
  --bg:#f3f5fa; --card:#fff; --text:#14213d; --muted:#67718c; --border:#e1e6ef;
  --danger:#d93a3a; --danger-soft:#fdeceb; --ok:#14935a; --ok-soft:#e6f6ee; --wa:#25d366;
  --radius:14px; --shadow:0 1px 2px rgba(16,30,80,.06),0 4px 14px rgba(16,30,80,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.demo{background:var(--yellow);color:var(--navy);font-size:12px;font-weight:600;text-align:center;padding:4px 8px}

/* layout */
.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:1200px;padding-bottom:40px}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.topbar-in{display:flex;align-items:center;gap:10px;max-width:1200px;margin:0 auto}
.topbar.narrow .topbar-in{max-width:488px}
.topbar img{height:26px;display:block}
.topbar .grow{flex:1}
.iconbtn{border:1px solid var(--border);background:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--navy)}
.iconbtn svg{width:18px;height:18px}
.lang{border:1px solid var(--border);background:#fff;border-radius:10px;height:36px;padding:0 8px;font-size:13px;font-weight:600;color:var(--navy)}

/* cards & buttons */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 12px;font-size:15px;color:var(--navy)}
.btn{border:0;border-radius:12px;height:48px;padding:0 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:active{background:var(--blue-d)}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--navy)}
.btn-danger{background:var(--danger);color:#fff}
.btn-wa{background:var(--wa);color:#fff;text-decoration:none}
.btn-block{width:100%}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue-d);vertical-align:middle}
.badge.y{background:var(--yellow-soft);color:#8a6d00}
.badge.g{background:var(--ok-soft);color:var(--ok)}
.badge.n{background:#eef0f5;color:var(--muted)}

/* login */
.login{min-height:calc(100vh - 26px);background:#fff;display:flex;flex-direction:column;justify-content:center;padding:24px 16px}
.login-card{max-width:420px;width:100%;margin:0 auto}
.login-logo{display:block;width:220px;max-width:70%;margin:0 auto 6px}
.login h1{text-align:center;font-size:18px;margin:4px 0 22px;color:var(--navy);letter-spacing:.2px}
.seg{display:flex;background:#eef1f7;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;height:40px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.alert{border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.alert.err{background:var(--danger-soft);color:var(--danger)}
.alert.info{background:var(--yellow-soft);color:#6f5800}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#2b3656}
.req{color:var(--danger)}
.input,.field input:not([type=checkbox]),.field select{width:100%;height:48px;border:1px solid var(--border);border-radius:11px;background:#fff;padding:0 12px;font-size:16px;outline:none}
.field input:focus,.field select:focus,.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,137,224,.15)}
.field.err input,.field.err select{border-color:var(--danger)}
.field .msg{color:var(--danger);font-size:12px;margin-top:5px}
.field .hint{color:var(--muted);font-size:12px;margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sticky-foot{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:15}
.sticky-foot .in{max-width:488px;margin:0 auto;display:flex;gap:10px}
.page-title{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.page-title h2{margin:0;font-size:19px;color:var(--navy)}
.back{border:0;background:#fff;border:1px solid var(--border);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--navy)}

/* home */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy-2) 60%,var(--blue));color:#fff;border-radius:18px;padding:20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,212,0,.18)}
.hero .g{font-size:14px;opacity:.85}
.hero .n{font-size:22px;font-weight:700;margin-top:2px}
.hero .d{font-size:13px;opacity:.75;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:28px;font-weight:700;color:var(--navy);margin-top:2px}
.action{width:100%;border:1px solid var(--border);background:#fff;border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:12px;box-shadow:var(--shadow)}
.action .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.action .ic svg{width:26px;height:26px}
.action .t{font-weight:700;font-size:16px;color:var(--navy);letter-spacing:.3px}
.action .s{font-size:13px;color:var(--muted)}
.action .chev{margin-left:auto;color:#a5adc2}
.action.primary .ic{background:var(--blue);color:#fff}
.action.secondary .ic{background:var(--yellow);color:var(--navy)}

/* submissions list */
.sub{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.sub .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sub .nm{font-weight:700;color:var(--navy)}
.sub .meta{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:10px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.sub .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* WhatsApp preview */
.wa-box{background:#e7ffdb;border:1px solid #c9eeb6;border-radius:12px;padding:14px;white-space:pre-wrap;font-size:14px;font-family:inherit;word-break:break-word}
.success-ic{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:6px auto 10px}

/* admin */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--border);background:#fff;border-radius:99px;height:38px;padding:0 16px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar{margin-bottom:10px}
.bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:8px}
.bar-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:8px;background:#eef1f7;border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--navy-2));border-radius:99px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.toolbar .field{margin:0;min-width:140px;flex:1}
.toolbar .field input,.toolbar .field select{height:42px;font-size:14px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:#f7f9fc;color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td .acts{display:flex;gap:6px}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.switch-row:last-child{border-bottom:0}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cfd5e2;border-radius:99px;transition:.2s}
.switch span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--blue)}
.switch input:checked+span:before{transform:translateX(20px)}
.chips{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f7f9fc;border:1px solid var(--border);border-radius:10px;padding:8px 8px 8px 12px;font-size:14px}
.chip button{border:0;background:transparent;color:var(--danger);font-size:18px;line-height:1;width:28px;height:28px;border-radius:8px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;height:42px;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:14px;min-width:0}
.section-gap{margin-top:14px}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(10,20,50,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:17px;color:var(--navy)}
.modal-b{padding:16px 18px;overflow-y:auto}
.modal-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
@media(min-width:640px){.overlay{align-items:center}.modal{border-radius:18px}}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.offline{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px;color:var(--navy);font-weight:600}
.offline svg{width:56px;height:56px;color:var(--danger)}

@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:380px){.row2{grid-template-columns:1fr}}
</style>
</head>

    m.el.addEventListener('click', e => { if (e.target === m.el || e.target.closest('[data-close]')) res(false); });
  });
}

const strip = u => { const { password, token, ...rest } = u; return { ...rest, online: !!token }; };

const DemoStore = {
  _load(){ let db = null; try { db = JSON.parse(localStorage.getItem(DB_KEY)); } catch {} if (!db) { db = seedDb(); this._save(db); } return db; },
  _save(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); },
  _acct(db, s){ return (s.role === 'admin' ? db.admins : db.users).find(x => x.id === s.id); },
  _dupErrors(subs, rec, excludeId){
    const errs = {}, same = subs.filter(s => s.id !== excludeId && (s.eventVenue || '') === (rec.eventVenue || ''));
    if (rec.idNumber && same.some(s => normKey(s.idNumber) === normKey(rec.idNumber))) errs.idNumber = 'dupId';
    if (rec.newNumber && same.some(s => s.newNumber === rec.newNumber)) errs.newNumber = 'dupNew';
    if (rec.gameId && same.some(s => normKey(s.gameId) === normKey(rec.gameId))) errs.gameId = 'dupGame';
    return Object.keys(errs).length ? errs : null;
  },

  async login(role, loginId, password){
    const db = this._load(), list = role === 'admin' ? db.admins : db.users;
    const u = list.find(x => x.loginId.toLowerCase() === loginId.trim().toLowerCase() && x.password === password);
    if (!u) return null;
    u.token = uid(); this._save(db);              // new token = any other device is logged out
    return { role, id: u.id, token: u.token };
  },
  async logout(s){ const db = this._load(), u = this._acct(db, s); if (u && u.token === s.token) { u.token = null; this._save(db); } },
  async sessionStatus(s){ const u = this._acct(this._load(), s); return !u ? 'removed' : u.token !== s.token ? 'kicked' : 'ok'; },
  async me(s){ const u = this._acct(this._load(), s); return u ? strip(u) : null; },
  async changeOwnPassword(s, cur, next){
    const db = this._load(), u = this._acct(db, s);
    if (!u || u.password !== cur) return { error: 'wrongPw' };
    u.password = next; this._save(db); return { ok: true };
  },

  async settings(){ return this._load().settings; },
  async saveSettings(st){ const db = this._load(); db.settings = st; this._save(db); },

  async submissions(){ return this._load().submissions.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)); },
  async addSubmission(s, rec){
    const db = this._load(), me = this._acct(db, s);
    const dup = this._dupErrors(db.submissions, rec); if (dup) return { errors: dup };
    const row = { ...rec, id: uid(), staffId: me.id, staffLoginId: me.loginId, staffName: me.name, createdAt: new Date().toISOString(), updatedAt: null, editedByStaff: false, editedByAdmin: false };
    db.submissions.push(row); this._save(db); return { row };
  },
  async updateSubmission(s, id, rec){
    const db = this._load(), row = db.submissions.find(x => x.id === id);
    if (!row) return { error: 'deleted' };
    if (s.role === 'sales' && (row.staffId !== s.id || row.editedByStaff)) return { error: 'locked' };
    const dup = this._dupErrors(db.submissions, rec, id); if (dup) return { errors: dup };
    Object.assign(row, rec, { updatedAt: new Date().toISOString() });
    if (s.role === 'sales') row.editedByStaff = true; else row.editedByAdmin = true;
    this._save(db); return { row };
  },
  async deleteSubmission(s, id){
    const db = this._load(), i = db.submissions.findIndex(x => x.id === id);
    if (i < 0) return; if (s.role === 'sales' && db.submissions[i].staffId !== s.id) return;
    db.submissions.splice(i, 1); this._save(db);
  },

  async users(){ return this._load().users.map(strip); },
  async addUser(u){
    const db = this._load();
    if ([...db.users, ...db.admins].some(x => x.loginId.toLowerCase() === u.loginId.toLowerCase())) return { error: 'idTaken' };
    db.users.push({ ...u, id: uid(), token: null, createdAt: new Date().toISOString() }); this._save(db); return { ok: true };
  },
  async resetUserPassword(id, pw){ const db = this._load(), u = db.users.find(x => x.id === id); if (u) { u.password = pw; u.token = null; this._save(db); } },
  async deleteUser(id){ const db = this._load(); db.users = db.users.filter(x => x.id !== id); this._save(db); },

  async admins(){ return this._load().admins.map(strip); },
  async addAdmin(s, a){
    const db = this._load(), me = this._acct(db, s);
    if (!me?.isMain) return { error: 'onlyMain' };
    if (db.admins.length >= 5) return { error: 'maxAdmins' };
    if ([...db.users, ...db.admins].some(x => x.loginId.toLowerCase() === a.loginId.toLowerCase())) return { error: 'idTaken' };
    db.admins.push({ ...a, id: uid(), isMain: false, token: null, createdAt: new Date().toISOString() }); this._save(db); return { ok: true };
  },
  async resetAdminPassword(s, id, pw){ const db = this._load(); if (!this._acct(db, s)?.isMain) return; const a = db.admins.find(x => x.id === id); if (a) { a.password = pw; a.token = null; this._save(db); } },
  async deleteAdmin(s, id){ const db = this._load(); if (!this._acct(db, s)?.isMain) return; db.admins = db.admins.filter(x => x.id !== id || x.isMain); this._save(db); },

  async resetDemo(){ localStorage.removeItem(DB_KEY); }
};

/* Live store: calls the app_* functions in supabase-setup.sql */
const CFG = window.APP_CONFIG || {};
const LIVE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_KEY);
async function rpc(fn, args = {}){
  const headers = { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY };
  if (!CFG.SUPABASE_KEY.startsWith('sb_')) headers.Authorization = 'Bearer ' + CFG.SUPABASE_KEY;   // legacy anon key
  const res = await fetch(`${CFG.SUPABASE_URL.replace(/\/+$/, '')}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(args) });
  const text = await res.text(), data = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const msg = String(data?.message || res.status);
    if (msg.includes('SESSION_INVALID')) setTimeout(watchSession, 0);
    else toast('Server error: ' + msg);
    throw new Error(msg);
  }
  return data;
}
const tok = () => session?.token;
const RemoteStore = {
  login: (role, loginId, password) => rpc('app_login', { p_role: role, p_login_id: loginId, p_password: password }),
  logout: s => rpc('app_logout', { p_token: s.token }),
  sessionStatus: s => rpc('app_session_status', { p_role: s.role, p_id: s.id, p_token: s.token }),
  me: s => rpc('app_me', { p_token: s.token }),
  changeOwnPassword: (s, cur, next) => rpc('app_change_password', { p_token: s.token, p_current: cur, p_new: next }),
  settings: () => rpc('app_get_settings', { p_token: tok() }),
  saveSettings: st => rpc('app_save_settings', { p_token: tok(), p_data: st }),

function bindForm(root){
  const idIn = $('[name=idNumber]', root), typeIn = $('[name=idType]', root);
  const fmt = () => { idIn.value = typeIn.value === 'IC' ? fmtIc(idIn.value) : fmtPassport(idIn.value); };
  $$('[data-idtype] button', root).forEach(b => b.onclick = () => {
    if (typeIn.value === b.dataset.v) return;
    typeIn.value = b.dataset.v; $$('[data-idtype] button', root).forEach(x => x.classList.toggle('on', x === b));
    const ic = b.dataset.v === 'IC'; idIn.value = ''; idIn.inputMode = ic ? 'numeric' : 'text'; idIn.placeholder = ic ? 'xxxxxx-xx-xxxx' : 'A12345678'; idIn.focus();
  });
  idIn.addEventListener('input', fmt);
  $$('[data-phone]', root).forEach(p => p.addEventListener('input', () => { p.value = p.value.replace(/\D/g, '').slice(0, 12); }));
  const nm = $('[name=fullName]', root); nm.addEventListener('blur', () => { nm.value = nm.value.toUpperCase().replace(/\s+/g, ' ').trim(); });
}
function readForm(root){
  const v = Object.fromEntries(new FormData($('form.rform', root)));
  for (const k in v) v[k] = String(v[k]).trim();
  v.fullName = v.fullName.toUpperCase().replace(/\s+/g, ' ');
  return v;
}
function validate(v, st){
  const e = {};
  if (!v.eventDate) e.eventDate = 'required';
  TOGGLEABLE.forEach(k => { if (st.mandatory[k] && !v[k]) e[k] = 'required'; });
  if (v.idNumber && !e.idNumber) {
    if (v.idType === 'IC' && v.idNumber.replace(/\D/g, '').length !== 12) e.idNumber = 'badIc';
    if (v.idType === 'Passport' && !/^[A-Z0-9]+$/.test(v.idNumber)) e.idNumber = 'badPassport';
  }
  ['currentNumber', 'newNumber'].forEach(k => { if (v[k] && !/^601\d{8,9}$/.test(v[k])) e[k] = 'badPhone'; });
  return e;
}
function showErrors(root, errs){
  $$('.field', root).forEach(f => { f.classList.remove('err'); $('.msg', f)?.remove(); });
  Object.entries(errs).forEach(([k, key]) => {
    const f = $(`[data-f="${k}"]`, root); if (!f) return;
    f.classList.add('err'); f.insertAdjacentHTML('beforeend', `<div class="msg">${t(key)}</div>`);
  });
  const first = $('.field.err', root); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (Object.keys(errs).length) toast(t('fixErrors'));
}

    const v = readForm(m.el), errs = validate(v, st);
    if (Object.keys(errs).length) return showErrors(m.el, errs);
    const res = await Store.updateSubmission(session, rec.id, v);
    if (res.errors) return showErrors(m.el, res.errors);
    m.close(); toast(t('updated')); after();
  };
}

function exportXlsx(rows){
  if (!window.XLSX) return toast(t('excelMissing'));
  const data = rows.slice().reverse().map((r, i) => ({
    'No': i + 1, 'Submitted At': fmtDateTime(r.createdAt), 'Event Date': fmtDate(r.eventDate), 'Event / Venue': r.eventVenue || '',
    'Customer Full Name': r.fullName || '', 'ID Type': r.idType, 'ID Number': r.idNumber || '', 'Current Number': r.currentNumber || '', 'New Number': r.newNumber || '',
    'Game ID': r.gameId || '', 'Server ID': r.serverId || '', 'Plan Subscribed': r.plan || '', 'Freebie': r.freebie || '',
    'Staff ID': r.staffLoginId, 'Staff Name': r.staffName, 'Edited by Staff': r.editedByStaff ? 'Yes' : 'No', 'Last Updated': r.updatedAt ? fmtDateTime(r.updatedAt) : ''
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = Object.keys(data[0] || { No: 1 }).map(k => ({ wch: Math.max(k.length + 2, ...data.map(d => String(d[k]).length + 2)) }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Submissions');
  const f = adminFilter;
  XLSX.writeFile(wb, `CelcomDigi_EventOps_${f.from || 'start'}_to_${f.to || isoDate(new Date())}.xlsx`);
}

function accountModal(title, withContact, onCreate){
  const m = openModal(title, `<form id="accForm" novalidate>
    <div class="field" data-f="loginId"><label>${t('loginId')} <span class="req">*</span></label><input name="loginId" autocapitalize="none"></div>
    <div class="field" data-f="password"><label>${t('password')} <span class="req">*</span></label><input name="password" type="text" autocomplete="off"><div class="hint">${withContact ? t('pwMin6') : t('pwMin8')}</div></div>
    <div class="field" data-f="name"><label>${t('name')} <span class="req">*</span></label><input name="name"></div>
    ${withContact ? `<div class="field" data-f="email"><label>${t('email')}</label><input name="email" type="email"></div>
    <div class="field" data-f="contact"><label>${t('contact')}</label><input name="contact" inputmode="numeric" placeholder="601xxxxxxxx"></div>` : ''}
  </form>`, `<button class="btn btn-ghost" data-close>${t('cancel')}</button><button class="btn btn-primary" data-save>${t('create')}</button>`);
  $('[data-save]', m.el).onclick = async () => {
    const v = Object.fromEntries([...new FormData($('#accForm', m.el))].map(([k, x]) => [k, String(x).trim()])), e = {};
    if (!v.loginId) e.loginId = 'required'; else if (/\s/.test(v.loginId)) e.loginId = 'badLoginId';
    if (v.password.length < (withContact ? 6 : 8)) e.password = withContact ? 'pwMin6' : 'pwMin8';
    if (!v.name) e.name = 'required';
    if (Object.keys(e).length) return showErrors(m.el, e);
    const res = await onCreate(v);
    if (res.error) return res.error === 'idTaken' ? showErrors(m.el, { loginId: 'idTaken' }) : toast(t(res.error));
    m.close();
  };
}
function resetPwModal(minLen, onSave){
  const m = openModal(t('resetPw'), `<div class="field" data-f="pw"><label>${t('newPw')}</label><input id="npw" type="text" autocomplete="off"><div class="hint">${t(minLen === 8 ? 'pwMin8' : 'pwMin6')}</div></div>`,
    `<button class="btn btn-ghost" data-close>${t('cancel')}</button><button class="btn btn-primary" data-save>${t('saveBtn')}</button>`);
  $('[data-save]', m.el).onclick = async () => {
    const pw = $('#npw', m.el).value; if (pw.length < minLen) return showErrors(m.el, { pw: minLen === 8 ? 'pwMin8' : 'pwMin6' });
    await onSave(pw); m.close(); toast(t('pwChanged'));
  };
}
function changeOwnPwModal(){
  const m = openModal(t('changePw'), `<div class="field" data-f="cur"><label>${t('currentPw')}</label><input id="cpw" type="password"></div>
    <div class="field" data-f="nw"><label>${t('newPw')}</label><input id="npw" type="password"><div class="hint">${t('pwMin8')}</div></div>`,
    `<button class="btn btn-ghost" data-close>${t('cancel')}</button><button class="btn btn-primary" data-save>${t('saveBtn')}</button>`);
  $('[data-save]', m.el).onclick = async () => {
    const cur = $('#cpw', m.el).value, nw = $('#npw', m.el).value;
    if (nw.length < 8) return showErrors(m.el, { nw: 'pwMin8' });
    const res = await Store.changeOwnPassword(session, cur, nw);
    if (res.error) return showErrors(m.el, { cur: 'wrongPw' });
    m.close(); toast(t('pwChanged'));
  };
}

async function adminStaff(body){
  const users = await Store.users(), subs = await Store.submissions();
  body.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary" id="addU">＋ ${t('addStaff')}</button></div>
    <div class="table-wrap"><table><thead><tr><th>${t('loginId')}</th><th>${t('name')}</th><th>${t('email')}</th><th>${t('contact')}</th><th>${t('subsCount')}</th><th>${t('status')}</th><th>${t('actions')}</th></tr></thead>
    <tbody>${users.length ? users.map(u => `<tr><td><b>${esc(u.loginId)}</b></td><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.contact)}</td>
      <td>${subs.filter(s => s.staffId === u.id).length}</td><td>${u.online ? `<span class="badge g">● ${t('loggedIn')}</span>` : `<span class="badge n">${t('notLoggedIn')}</span>`}</td>
      <td><div class="acts"><button class="btn btn-ghost btn-sm" data-reset="${u.id}">${t('resetPw')}</button><button class="btn btn-ghost btn-sm" style="color:var(--danger)" data-del="${u.id}">${t('del')}</button></div></td></tr>`).join('')
      : `<tr><td colspan="7" class="empty">${t('noData')}</td></tr>`}</tbody></table></div>`;
  $('#addU').onclick = () => accountModal(t('addStaff'), true, async v => { const r = await Store.addUser(v); if (r.ok) adminStaff(body); return r; });
  $$('[data-reset]', body).forEach(b => b.onclick = () => resetPwModal(6, pw => Store.resetUserPassword(b.dataset.reset, pw).then(() => adminStaff(body))));
  $$('[data-del]', body).forEach(b => b.onclick = async () => {
    if (!(await confirmBox(t('confirmDelUser'), t('del')))) return;
    await Store.deleteUser(b.dataset.del); toast(t('deleted')); adminStaff(body);
  });
}

async function adminAdmins(body, me){
  const admins = await Store.admins();
  body.innerHTML = `
    ${!me.isMain ? `<div class="alert info">${t('onlyMain')}</div>` : ''}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span class="muted">${admins.length} / 5</span>
      ${me.isMain ? `<button class="btn btn-primary" id="addA" ${admins.length >= 5 ? 'disabled' : ''}>＋ ${t('addAdmin')}</button>` : ''}</div>
    <div class="table-wrap"><table><thead><tr><th>${t('loginId')}</th><th>${t('name')}</th><th>${t('status')}</th>${me.isMain ? `<th>${t('actions')}</th>` : ''}</tr></thead>
    <tbody>${admins.map(a => `<tr><td><b>${esc(a.loginId)}</b> ${a.isMain ? `<span class="badge">${t('mainAdmin')}</span>` : ''}</td><td>${esc(a.name)}</td>
      <td>${a.online ? `<span class="badge g">● ${t('loggedIn')}</span>` : `<span class="badge n">${t('notLoggedIn')}</span>`}</td>
      ${me.isMain ? `<td>${a.isMain ? '' : `<div class="acts"><button class="btn btn-ghost btn-sm" data-reset="${a.id}">${t('resetPw')}</button><button class="btn btn-ghost btn-sm" style="color:var(--danger)" data-del="${a.id}">${t('del')}</button></div>`}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
  if (!me.isMain) return;
  $('#addA').onclick = () => accountModal(t('addAdmin'), false, async v => { const r = await Store.addAdmin(session, v); if (r.ok) adminAdmins(body, me); return r; });
  $$('[data-reset]', body).forEach(b => b.onclick = () => resetPwModal(8, pw => Store.resetAdminPassword(session, b.dataset.reset, pw).then(() => adminAdmins(body, me))));
  $$('[data-del]', body).forEach(b => b.onclick = async () => {
    if (!(await confirmBox(t('confirmDelUser'), t('del')))) return;
    await Store.deleteAdmin(session, b.dataset.del); toast(t('deleted')); adminAdmins(body, me);
  });
}

async function adminSettings(body, me){
  const st = await Store.settings();
  const listCard = (key, title) => `<div class="card"><h3>${title}</h3>
    <div class="chips">${st[key].map((x, i) => `<div class="chip"><span>${esc(x)}</span><button data-rm="${key}:${i}" aria-label="${t('del')}">×</button></div>`).join('') || `<p class="muted" style="margin:0">${t('noData')}</p>`}</div>
    <div class="add-row"><input data-new="${key}" placeholder="${t('newItem')}"><button class="btn btn-primary btn-sm" style="height:42px" data-add="${key}">${t('addItem')}</button></div></div>`;
  body.innerHTML = `<div class="grid2">
    <div class="card"><h3>${t('mandatory')}</h3><p class="muted" style="margin:-6px 0 6px;font-size:13px">${t('mandatoryHint')}</p>
      ${TOGGLEABLE.map(k => `<div class="switch-row"><span>${t('f_' + k)}</span><label class="switch"><input type="checkbox" data-m="${k}" ${st.mandatory[k] ? 'checked' : ''}><span></span></label></div>`).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:14px">${listCard('events', t('listEvents'))}${listCard('plans', t('listPlans'))}${listCard('freebies', t('listFreebies'))}</div>
  </div>
  ${me.isMain && !LIVE ? `<div style="margin-top:20px;text-align:right"><button class="btn btn-ghost btn-sm" id="resetDemo" style="color:var(--danger)">${t('resetDemo')}</button></div>` : ''}`;
  const save = async () => { await Store.saveSettings(st); toast(t('updated')); adminSettings(body, me); };
  $$('[data-m]', body).forEach(c => c.onchange = () => { st.mandatory[c.dataset.m] = c.checked; Store.saveSettings(st).then(() => toast(t('updated'))); });
  $$('[data-rm]', body).forEach(b => b.onclick = () => { const [k, i] = b.dataset.rm.split(':'); st[k].splice(+i, 1); save(); });
  const add = k => { const inp = $(`[data-new="${k}"]`, body), v = inp.value.trim(); if (!v) return; if (st[k].includes(v)) return toast(t('itemExists')); st[k].push(v); save(); };
  $$('[data-add]', body).forEach(b => b.onclick = () => add(b.dataset.add));
  $$('[data-new]', body).forEach(i => i.onkeydown = e => { if (e.key === 'Enter') add(i.dataset.new); });
  $('#resetDemo')?.addEventListener('click', async () => { if (await confirmBox(t('resetDemoQ'))) { await Store.resetDemo(); setSession(null); route(); } });
}
